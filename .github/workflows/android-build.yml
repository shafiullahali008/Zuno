
name: Build ZUNO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ZUNO 5.5.0 APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZUNO 5.5.0 Source
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/ZUNO-Android-5.5.0-30H-Release-Daily-App-Limits.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZUNO 5.5.0 ZIP not found."
            echo "Repository files:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/zuno-source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/zuno-source"

          WRAPPER=$(find "$RUNNER_TEMP/zuno-source" \
            -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            find "$RUNNER_TEMP/zuno-source" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          REQUIRED_FILES=(
            "settings.gradle"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$PROJECT_DIR/$FILE" ]; then
              echo "ERROR: Missing required file: $FILE"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ZUNO project found: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK location not found."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Collect APK Files
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk \
            "$GITHUB_WORKSPACE/artifacts/"

          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk \
            "$GITHUB_WORKSPACE/artifacts/"

          echo "Generated APK files:"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload ZUNO APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-5.5.0-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
          
