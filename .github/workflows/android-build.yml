
name: Build ZUNO 5.6.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ZUNO Android Build
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract ZIP and locate Android project
      - name: Extract ZUNO Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/ZUNO-Android-5.6.0-Redesigned-UI.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZUNO 5.6.0 ZIP not found."
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/zuno-source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/zuno-source"

          WRAPPER=$(find "$RUNNER_TEMP/zuno-source" \
            -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle wrapper JAR missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      # 4. Install required Android SDK packages
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Verify Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --version

      # 6. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      # 7. Build Release APK
      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease --stacktrace

      # 8. Collect generated APKs
      - name: Collect APK Files
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          DEBUG_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"
          RELEASE_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          if ! find "$DEBUG_DIR" -type f -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null; then
            echo "ERROR: Debug APK not generated."
            exit 1
          fi

          if ! find "$RELEASE_DIR" -type f -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null; then
            echo "ERROR: Release APK not generated."
            exit 1
          fi

          echo "Generated APKs:"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      # 9. Upload APK artifacts
      - name: Upload ZUNO APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-5.6.0-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
          
