
name: ZUNO Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build ZUNO APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          echo "Repository contents:"
          ls -la

          WRAPPER=$(find . -maxdepth 5 -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          PROJECT_DIR=${PROJECT_DIR#./}

          if [ "$PROJECT_DIR" = "$WRAPPER" ]; then
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Configure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant Gradle permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Check Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-Release-APK
          path: "**/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          
