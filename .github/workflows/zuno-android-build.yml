
name: ZUNO 5.1.0 Android Build

on:
  push:
    paths:
      - 'ZUNO-Android-5.1.0-Black-Gold-UI-Complete-Source.zip'
      - '.github/workflows/zuno-android-build.yml'
  pull_request:
    paths:
      - 'ZUNO-Android-5.1.0-Black-Gold-UI-Complete-Source.zip'
      - '.github/workflows/zuno-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zuno-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZUNO Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP Filename and Integrity
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ZUNO-Android-5.1.0-Black-Gold-UI-Complete-Source.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: Required ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity verified."

      - name: Extract ZUNO Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ZUNO-Android-5.1.0-Black-Gold-UI-Complete-Source.zip"

          rm -rf _zuno_source
          mkdir -p _zuno_source

          unzip -q "$ZIP_FILE" -d _zuno_source

          SETTINGS_FILE="$(
            find _zuno_source -type f \
              -name settings.gradle -print -quit
          )"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          PROJECT_DIR="${SETTINGS_FILE%/settings.gradle}"

          REQUIRED_FILES=(
            "build.gradle"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "gradlew"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$PROJECT_DIR/$FILE" ]]; then
              echo "ERROR: Missing project file: $FILE"
              exit 1
            fi
          done

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ZUNO source extracted successfully."

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Model Validation Dependency
        run: |
          python -m pip install --disable-pip-version-check numpy

      - name: Validate Python Source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m compileall -q \
            developer-tools/NEXAS_PUREVIEW_TOOLKIT/tools

      - name: Validate TFLite Models
        working-directory: ${{ env.PROJECT_DIR }}/developer-tools/NEXAS_PUREVIEW_TOOLKIT
        run: |
          python tools/validate_generated_models.py
          python tools/sync_model_hashes.py --check

      - name: Verify Model Checksums
        working-directory: ${{ env.PROJECT_DIR }}/app/src/main/assets/models
        run: |
          sha256sum -c MODEL_SHA256SUMS.txt

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK 35
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run Unit Tests and Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            testDebugUnitTest \
            assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "ZUNO APK generated successfully."
          ls -lh "$APK"

      - name: Upload ZUNO Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-5.1.0-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
